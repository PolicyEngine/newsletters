name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-newsletters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint newsletter HTML files
        run: |
          chmod +x scripts/lint-newsletters.sh
          ./scripts/lint-newsletters.sh

  comparables:
    # Max, 2026-10-21: "even if we've already published something, we should
    # do a fresh comp review before big pushes like newsletters". Every
    # policyengine.org analysis an edition dated on or after the cutover links
    # needs a comparables search in PolicyEngine/policyengine-scorecard within
    # the scorecard's promotion window (src/newsletter_uploader/comparables.py).
    # It downloads the scorecard index and app-v2's registries only when such
    # an edition exists, and fails if it cannot read them.
    name: Fresh comparables for promoted analyses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Every analysis an edition links has a fresh comparables search
        run: python -m newsletter_uploader.comparables editions

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          black --check src/ tests/
          ruff check src/ tests/

      - name: Run tests
        run: |
          pytest -v --cov=newsletter_uploader --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: false
